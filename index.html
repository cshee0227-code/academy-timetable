<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학원 시간표</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00463c"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="학원 시간표">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style id="css">
/* VOICE: 교무실 벽 시간표판처럼 차분하고 정확한 업무 도구
   IDEA: 자석 이름표를 붙이는 주간 시간표 보드 (교시 × 선생님)
   PICTURE: 보드 자체가 그림 — 빈칸(공강)은 코랄 점선, 충돌은 코랄 테두리
   COLOUR and TYPE: 딥그린 #00463c 헤더, 흰 바탕, 라임화이트·코랄 / Inter Tight + Noto Sans KR
   LAYOUT: 상단 요약 수치 → 요일 탭 → 보드, 휴대폰은 가로 스크롤 */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0e1513);--ink:light-dark(#10211d,#e6efe9);--mute:light-dark(#5c6b67,#9aaba5);--line:light-dark(#dfe6e3,#24322e);--card:light-dark(#f4f8f6,#15201d);--g:#00463c;--lime:#e6f5c8;--coral:#ff6f59;--coralbg:light-dark(#fff0ec,#3a1f1a);--off:light-dark(#eef1f0,#121b19)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
.num,.t{font-family:"Inter Tight","Noto Sans KR",sans-serif;font-variant-numeric:tabular-nums}
header{background:var(--g);color:#fff;padding:22px max(4vw,16px) 18px}
.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:baseline;justify-content:space-between}
h1{margin:0;font:700 32px/1.05 "Inter Tight","Noto Sans KR",sans-serif;letter-spacing:-.5px}
.status{font-size:13px;color:var(--lime);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--lime)}.status.busy .dot{background:var(--coral)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;margin-top:16px;background:rgba(255,255,255,.18);border-radius:10px;overflow:hidden}
.kpi{background:var(--g);padding:10px 14px}.kpi b{display:block;font:700 28px/1.1 "Inter Tight",sans-serif}.kpi span{font-size:13px;color:#cfe3dc}
.kpi.bad b{color:var(--coral)}
nav{display:flex;gap:4px;margin-top:16px;overflow-x:auto}
nav button{flex:none;background:transparent;color:#d6e8e1;border:0;border-bottom:3px solid transparent;padding:8px 12px;font:500 16px "Noto Sans KR";cursor:pointer;min-height:44px}
nav button[aria-current=true]{color:#fff;border-color:var(--lime)}
main{padding:18px max(4vw,16px) 48px;max-width:1500px;margin:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.btn{min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 15px "Noto Sans KR";cursor:pointer}
.btn.pri{background:var(--g);color:#fff;border-color:var(--g)}.btn.warn{color:var(--coral)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,select:focus-visible,input:focus-visible,nav button:focus-visible,td button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{min-width:52px;min-height:44px;border-radius:22px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:700 16px "Noto Sans KR";cursor:pointer}
.days button[aria-pressed=true]{background:var(--g);color:#fff;border-color:var(--g)}
.spacer{flex:1}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.board{border-collapse:separate;border-spacing:0;width:100%;min-width:max-content}
.board th,.board td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0}
.board thead th{position:sticky;top:0;background:var(--card);z-index:2;padding:8px 10px;text-align:left;font-weight:500;min-width:118px;vertical-align:top}
.board thead th small,.board td small{display:block;color:var(--mute);font-size:13px;font-weight:400;white-space:nowrap}
.board th.time{position:sticky;left:0;z-index:3;background:var(--bg);min-width:74px;text-align:right;padding:6px 10px;vertical-align:top}
.board thead th.time{z-index:4;background:var(--card)}
.time b{font:700 17px "Inter Tight";display:block}.time small{font-size:13px}
td button{display:block;width:100%;min-height:52px;border:0;background:transparent;color:inherit;text-align:left;padding:6px 9px;font:inherit;cursor:pointer}
td.off{background:repeating-linear-gradient(135deg,var(--off) 0 6px,transparent 6px 12px)}
td.off button{cursor:default}
td.gap button{outline:2px dashed var(--coral);outline-offset:-5px;color:var(--coral);font-size:13px}
td.brk button{outline:2px dashed var(--mute);outline-offset:-5px;color:var(--mute);font-size:13px}
.chip{display:block;border-radius:6px;padding:4px 8px;background:color-mix(in srgb,var(--c) 16%,var(--bg));border-left:4px solid var(--c);font-weight:500;white-space:nowrap}
td.bad .chip{background:var(--coralbg);border-left-color:var(--coral);box-shadow:inset 0 0 0 2px var(--coral)}
td.warn .chip{box-shadow:inset 0 0 0 2px #e3a33a}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--mute);margin-top:10px}
.legend i{display:inline-block;width:16px;height:12px;vertical-align:-1px;margin-right:5px;border-radius:3px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:18px}
@media(max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.panel{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--card)}
.panel h3{margin:0 0 8px;font-size:17px}
.list{list-style:none;margin:0;padding:0;font-size:15px}.list li{padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;justify-content:space-between}
.list li:last-child{border:0}.tag{font-size:13px;color:var(--coral);white-space:nowrap}.ok{color:var(--g)}:root[data-theme=dark] .ok{color:#9fd8b8}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .ok{color:#9fd8b8}}
select,input{font:16px "Noto Sans KR";min-height:44px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=number]{width:72px}
details.rec{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--bg)}
details.rec summary{padding:12px 14px;cursor:pointer;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
details.rec summary b{font-size:16px}details.rec summary span{color:var(--mute);font-size:14px}
.recbody{padding:0 14px 14px;display:grid;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row label{font-size:14px;color:var(--mute);min-width:28px}
.daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.daygrid .row{background:var(--card);border-radius:8px;padding:6px 8px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}@media(max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
h2{font:700 22px/1.2 "Inter Tight","Noto Sans KR";margin:6px 0 12px}
.note{font-size:13px;color:var(--mute)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet>div{background:var(--bg);width:min(560px,100%);max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px}
@media(min-width:700px){.sheet{align-items:center}.sheet>div{border-radius:16px}}
.pick{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:10px 12px;margin-bottom:6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:15px "Noto Sans KR";cursor:pointer;min-height:48px}
.pick.cur{border-color:var(--g);box-shadow:inset 0 0 0 2px var(--g)}
.pick em{font-style:normal;font-size:13px;color:var(--mute);white-space:nowrap}.pick em.x{color:var(--coral)}
.prog{font-size:14px;color:var(--mute)}
.board td button .chip{cursor:grab;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
td.dsrc .chip{opacity:.35}
td.dz-ok button{outline:3px solid var(--g);outline-offset:-3px;background:color-mix(in srgb,var(--g) 12%,transparent)}
td.dz-warn button{outline:3px solid #e3a33a;outline-offset:-3px;background:color-mix(in srgb,#e3a33a 14%,transparent)}
td.dz-no button{outline:3px solid var(--coral);outline-offset:-3px;background:var(--coralbg)}
.ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;background:var(--g);color:#fff;border-radius:10px;padding:8px 12px;box-shadow:0 10px 28px rgba(0,0,0,.28);max-width:260px}
.ghost b{display:block;font-size:16px}.ghost small{display:block;font-size:13px;color:var(--lime)}
.ghost.g-warn{background:#8a5a10}.ghost.g-no{background:#9c3020}
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;width:132px;height:14px}
.strip i{border-radius:2px;background:var(--off)}.strip i.on{background:var(--c)}.strip i.g{background:var(--coral)}
.strip i.x{background:repeating-linear-gradient(135deg,var(--line) 0 2px,transparent 2px 4px)}
.fc{padding:8px 10px;display:grid;gap:4px}.fc small{font-size:13px;color:var(--mute);white-space:nowrap}
.flow td{min-width:156px;vertical-align:top}.flow td.fbad{background:var(--coralbg)}
.flow th.time{min-width:118px}.flow th.time small{display:block;font-weight:400}.lnk{background:none;border:0;padding:0;font:700 16px "Noto Sans KR";color:var(--ink);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;min-height:28px}
@media(prefers-reduced-motion:no-preference){td button .chip{transition:transform .15s}td button:hover .chip{transform:translateY(-1px)}}
@media(max-width:600px){h1{font-size:26px}.kpi b{font-size:22px}}
</style></head><body><div id="root"></div>

<script id="app">
{

function seed(){
  let r=7;const rnd=()=>(r=(r*1103515245+12345)%2147483648)/2147483648;
  const subj=['수학','수학','수학','영어','영어','영어','국어','국어','과학','사회'];
  const tn=['김서연','이준호','박지민','최유나','정민재','강하은','조현우','윤소희','임도윤','한지수'];
  const tav=[[3,12],[4,12],[5,12],[2,11],[4,12],[5,12],[3,11],[5,12],[4,12],[5,12]];
  const teachers=tn.map((n,i)=>({id:'T'+(i+1),name:n,subj:subj[i],av:DAYS.map(()=>tav[i].slice())}));
  const sn='서준 하윤 도윤 서아 시우 지아 주원 하은 지호 수아 예준 지유 건우 윤서 우진 채원 선우 지안 민준 다은 유준 소율 은우 예린 현우 나윤 지훈 서윤 승민 아린'.split(' ');
  const fam='김이박최정강조윤장임한오서신권황안송류홍';
  const grades=['초4','초5','초6','중1','중2','중3','고1','고2'];
  const students=sn.map((n,i)=>{const g=grades[Math.floor(rnd()*grades.length)];const st=g[0]==='초'?5:g[0]==='중'?7:8;
    const pool=['수학','영어','국어','과학','사회'];const want=2+Math.floor(rnd()*3);const subs=pool.slice(0,2);while(subs.length<want){const x=pool[2+Math.floor(rnd()*3)];if(!subs.includes(x))subs.push(x)}
    const req=subs.map((s,k)=>{const c=teachers.filter(t=>t.subj===s);return{t:c[Math.floor(rnd()*c.length)].id,n:k<2?2:1}});
    return{id:'S'+(i+1),name:fam[i%fam.length]+n,grade:g,av:DAYS.map(()=>[st,12]),req,span:[2,4]}});
  return{v:1,teachers,students,assign:{},sample:true};
}

/* ---------- core ---------- */
const K=(d,p,t)=>d+'|'+p+'|'+t;
const T=id=>S.teachers.find(t=>t.id===id),ST=id=>S.students.find(s=>s.id===id);
const inAv=(av,p)=>!!av&&p>=av[0]&&p<av[1];
function idleOf(arr,allow){const on=[];arr.forEach((v,p)=>{if(v)on.push(p)});if(on.length<2)return{idle:[],cost:0,n:on.length};
  const idle=[];for(let p=on[0];p<on[on.length-1];p++)if(!arr[p])idle.push(p);return{idle,cost:Math.max(0,idle.length-(allow&&on.length>=5?1:0)),n:on.length}}
function analyze(st){
  const A=st.assign,tDay={},sDay={},cnt={},sAt={},bad={},warn={};
  for(const k in A){const[d,p,t]=k.split('|');const sid=A[k];const s=st.students.find(x=>x.id===sid),te=st.teachers.find(x=>x.id===t);
    if(!s||!te){bad[k]='없는 데이터';continue}
    (tDay[t+'|'+d]??=Array(P).fill(0))[p]=1;(sDay[sid+'|'+d]??=Array(P).fill(0))[p]=1;
    cnt[sid+'|'+t]=(cnt[sid+'|'+t]||0)+1;(sAt[d+'|'+p+'|'+sid]??=[]).push(k);
    if(!inAv(te.av[d],+p))bad[k]='선생님 근무시간 외';
    else if(!inAv(s.av[d],+p))warn[k]='학생 가능시간 외';
    else if(!s.req.some(r=>r.t===t))warn[k]='담당 선생님 아님'}
  for(const x in sAt)if(sAt[x].length>1)sAt[x].forEach(k=>bad[k]='학생 시간 중복');
  let need=0,placed=0;const short=[];
  st.students.forEach(s=>s.req.forEach(r=>{const c=cnt[s.id+'|'+r.t]||0;need+=r.n;placed+=Math.min(c,r.n);if(c!==r.n)short.push({s,r,c})}));
  let tg=0,sg=0;const tGap={},tBrk={},sGapL=[];
  for(const x in tDay){const o=idleOf(tDay[x],true);tg+=o.cost;o.idle.forEach((p,i)=>{(i<o.cost?tGap:tBrk)[x+'|'+p]=1})}
  const sInfo={};let sdOk=0,sdAll=0;
  for(const x in sDay){const o=idleOf(sDay[x],false);sg+=o.cost;const[sid,d]=x.split('|');if(o.cost)sGapL.push({sid,d:+d,n:o.cost});
    const s=st.students.find(q=>q.id===sid);const sp=(s&&s.span)||[1,P];const on=sDay[x].map((v,p)=>v?p:-1).filter(p=>p>=0);
    const stt=o.cost?'gap':o.n<sp[0]?'short':o.n>sp[1]?'over':'ok';sInfo[x]={n:o.n,idle:o.idle,a:on[0],b:on[on.length-1],st:stt};sdAll++;if(stt==='ok')sdOk++}
  return{tDay,sDay,cnt,bad,warn,need,placed,short,tg,sg,tGap,tBrk,sGapL,sInfo,sdOk,sdAll};
}
function autoSchedule(st,mode,R){
  const base={};
  if(mode==='fill'){const an=analyze(st);const used={};for(const k in st.assign){if(an.bad[k])continue;const[d,p,t]=k.split('|');const sid=st.assign[k];const s=st.students.find(x=>x.id===sid);const r=s&&s.req.find(q=>q.t===t);if(!r)continue;const c=used[sid+'|'+t]||0;if(c>=r.n)continue;used[sid+'|'+t]=c+1;base[k]=sid}}
  const tch=Object.fromEntries(st.teachers.map(t=>[t.id,t]));
  const flex=s=>s.av.reduce((a,v)=>a+(v?v[1]-v[0]:0),0);
  let best=null;
  for(let it=0;it<R;it++){
    const A=Object.assign({},base),tb={},sb={},sd={};
    const tArr=(t,d)=>tb[t+'|'+d]??=Array(P).fill(0),sArr=(s,d)=>sb[s+'|'+d]??=Array(P).fill(0);
    const put=(d,p,t,s)=>{A[K(d,p,t)]=s;tArr(t,d)[p]=1;sArr(s,d)[p]=1;sd[s+'|'+t+'|'+d]=1};
    for(const k in A){const[d,p,t]=k.split('|');put(+d,+p,t,A[k])}
    const bundles=[];
    st.students.forEach(s=>{const rem=s.req.map(r=>({t:r.t,n:r.n-Object.keys(A).filter(k=>A[k]===s.id&&k.endsWith('|'+r.t)).length})).filter(r=>r.n>0&&tch[r.t]);
      const U=rem.reduce((a,r)=>a+r.n,0);if(!U)return;const sp=s.span||[2,4];
      const k=Math.min(ND,Math.max(Math.ceil(U/sp[1]),...rem.map(r=>r.n)));const bs=Array.from({length:k},()=>[]);
      rem.slice().sort((a,b)=>b.n-a.n||Math.random()-.5).forEach(r=>{const idx=bs.map((b,i)=>i).sort((a,b)=>bs[a].length-bs[b].length||Math.random()-.5).slice(0,r.n);idx.forEach(i=>bs[i].push(r.t))});
      bs.filter(b=>b.length).forEach(ts=>bundles.push({s,ts,key:flex(s)+Math.random()*6}))});
    bundles.sort((a,b)=>b.ts.length-a.ts.length||a.key-b.key);
    let unmet=0;
    const gapC=(arr,add,allow)=>{const c=arr.slice();add.forEach(p=>c[p]=1);return idleOf(c,allow).cost-idleOf(arr,allow).cost};
    const tryPlace=(s,ts)=>{let bp=null,bs=1e9;
      for(let d=0;d<ND;d++){const av=s.av[d];if(!av)continue;if(ts.some(t=>sd[s.id+'|'+t+'|'+d]))continue;
        const sa=sArr(s.id,d);const cntDay=sa.filter(Boolean).length,hasDay=cntDay>0;if(hasDay&&cntDay+ts.length>((s.span||[2,4])[1]))continue;
        for(const pm of perms(ts))for(let p0=av[0];p0+pm.length<=av[1];p0++){let ok=true,sc=0;
          for(let i=0;i<pm.length&&ok;i++){const p=p0+i,t=pm[i];if(!inAv(tch[t].av[d],p)||tArr(t,d)[p]||sa[p])ok=false;else{const ta=tArr(t,d);sc+=3*gapC(ta,[p],true);if(!ta.some(Boolean))sc+=1.2}}
          if(!ok)continue;const ps=pm.map((t,i)=>p0+i);sc+=6*gapC(sa,ps,false)+(hasDay?0:.8)+Math.random()*.4;
          if(sc<bs){bs=sc;bp={d,p0,pm}}}}
      return bp};
    for(const b of bundles){const bp=tryPlace(b.s,b.ts);
      if(bp)bp.pm.forEach((t,i)=>put(bp.d,bp.p0+i,t,b.s.id));
      else b.ts.forEach(t=>{const one=tryPlace(b.s,[t]);if(one)put(one.d,one.p0,t,b.s.id);else unmet++})}
    const an=analyze({...st,assign:A});const cost=1000*(an.need-an.placed)+3*an.tg+8*an.sg+4*(an.sdAll-an.sdOk);
    if(!best||cost<best.cost)best={assign:A,cost};
  }
  return best;
}

else{S.teachers.forEach(t=>t.av=t.av.slice(0,ND));S.students.forEach(s=>{s.av=s.av.slice(0,ND);if(!s.span)s.span=[2,4]});for(const k in S.assign)if(+k.split('|')[0]>=ND)delete S.assign[k]}

  ${desktopApi?'<div class="row" style="margin-top:8px"><button class="btn pri" id="instD">데스크톱 앱으로 설치</button></div>':''}<p class="note" id="bk"></p></section>
  <p class="note">출근시간·등원시간을 바꾸면 보드에서 맞지 않는 칸이 즉시 충돌로 표시됩니다. 주간 보드의 '남은 수업 자동 배정'을 누르면 충돌 칸만 다시 맞춥니다.${S.sample?' 현재는 예시 데이터입니다.':''}</p>`}

function openCell(k){if(!canEdit)return;const[d,p,t]=k.split('|');const te=T(t);const cur=S.assign[k];const an=analyze(S);
  if(!inAv(te.av[d],+p)&&!cur)return;
  const busyAt=sid=>S.teachers.some(x=>x.id!==t&&S.assign[K(d,p,x.id)]===sid);
  const sameDay=sid=>Array.from({length:P},(_,q)=>q).some(q=>q!=p&&S.assign[K(d,q,t)]===sid);
  const item=s=>{const r=s.req.find(q=>q.t===t);const c=an.cnt[s.id+'|'+t]||0;const tags=[];
    if(busyAt(s.id))tags.push(['x','이 시간 다른 수업']);if(!inAv(s.av[d],+p))tags.push(['x','등원 시간 외']);if(sameDay(s.id))tags.push(['x','같은 날 이미 배정']);
    if(r)tags.push(['',c+'/'+r.n+'회']);
    return`<button class="pick ${s.id===cur?'cur':''}" data-pick="${s.id}"><span>${esc(s.name)} <span class="note">${esc(s.grade)}</span></span><span>${tags.map(([c2,x])=>`<em class="${c2}">${x}</em>`).join(' ')}</span></button>`};
  const mine=S.students.filter(s=>s.req.some(r=>r.t===t)),others=S.students.filter(s=>!s.req.some(r=>r.t===t));
  const el=document.createElement('div');el.className='sheet';
  el.innerHTML=`<div role="dialog" aria-modal="true" aria-label="수업 배정"><h2>${DAYS[d]} ${fm(+p)} · ${esc(te.name)} 선생님</h2>
   ${cur?`<button class="btn warn" data-pick="" style="width:100%;margin-bottom:12px">이 칸 비우기</button>`:''}
   <p class="note">담당 학생</p>${mine.map(item).join('')||'<p class="note">담당 학생이 없습니다.</p>'}
   <details><summary class="note" style="padding:10px 0;cursor:pointer">다른 학생 ${others.length}명</summary>${others.map(item).join('')}</details>
   <button class="btn" id="closeSheet" style="width:100%;margin-top:10px">닫기</button></div>`;
  document.body.appendChild(el);const close=()=>el.remove();
  el.addEventListener('click',e=>{if(e.target===el||e.target.id==='closeSheet')return close();const b=e.target.closest('[data-pick]');if(!b)return;const sid=b.dataset.pick;
    close();commit(()=>{if(sid)S.assign[k]=sid;else delete S.assign[k]},`${DAYS[d]} ${fm(+p)} ${te.name}: `+(sid?`${ST(sid)?.name||''} 배정`:`${ST(cur)?.name||''} 비움`))});
  el.querySelector('button')?.focus()}

function runAuto(md){const pr=document.getElementById('prog');if(pr)pr.textContent='최적안 계산 중…';
  setTimeout(()=>{const r=autoSchedule(S,md,md==='all'?40:25);commit(()=>{S.assign=r.assign},md==='all'?'전체 재배정':'남은 수업 자동 배정')},30)}
function wire(an){
  root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ui.tab=b.dataset.tab;history.replaceState(null,'','#'+ui.tab);render()});
  root.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{ui.day=+b.dataset.day;render()});
  root.querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>{if(Date.now()-dragEndAt<400)return;openCell(b.dataset.cell)});
  const g=id=>document.getElementById(id);
  if(g('autoFill'))g('autoFill').onclick=()=>runAuto('fill');
  if(g('autoAll'))g('autoAll').onclick=()=>runAuto('all');
  if(g('undo'))g('undo').onclick=()=>{if(!hist.length)return;S=JSON.parse(hist.pop());S.log=[{u:myId,t:Date.now(),m:'실행 취소'},...(S.log||[])].slice(0,60);dirty=true;render();queueSave()};
  if(g('who'))g('who').onchange=e=>{ui.who=e.target.value;history.replaceState(null,'','#'+(T(ui.who)?'teacher-':'student-')+ui.who);render()};
  if(g('copyLink'))g('copyLink').onclick=async e=>{const h2='#'+(T(ui.who)?'teacher-':'student-')+ui.who;history.replaceState(null,'','#'+h2.slice(1));
    try{await navigator.clipboard.writeText(location.href.split('#')[0]+h2);g('prog').textContent='링크를 복사했습니다'}catch(x){g('prog').textContent='주소창의 링크를 복사해 주세요'}};
  root.querySelectorAll('[data-f]').forEach(inp=>inp.onchange=()=>{const[w,i,f]=inp.dataset.f.split('|');commit(()=>{(w==='t'?S.teachers:S.students)[i][f]=inp.value.trim()||'이름 없음'},'정보 수정: '+(inp.value.trim()||'이름 없음'))});
  root.querySelectorAll('[data-av]').forEach(sel=>sel.onchange=()=>{const[w,i,d,e]=sel.dataset.av.split('|');const o=(w==='t'?S.teachers:S.students)[i];const v=+sel.value;
    commit(()=>{if(e==='0'){if(v<0)o.av[d]=null;else{const end=o.av[d]?Math.max(o.av[d][1],v+1):P;o.av[d]=[v,end]}}else{o.av[d][1]=Math.max(v,o.av[d][0]+1)}},`${o.name} ${DAYS[d]} 시간 변경`)});
  root.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const[w,i]=b.dataset.copy.split('|');const o=(w==='t'?S.teachers:S.students)[i];commit(()=>{for(let d=1;d<ND;d++)o.av[d]=o.av[0]?o.av[0].slice():null})});
  root.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const[w,i]=b.dataset.del.split('|');commit(()=>{const arr=w==='t'?S.teachers:S.students;const id=arr[i].id;arr.splice(i,1);
    for(const k in S.assign){if(w==='t'?k.endsWith('|'+id):S.assign[k]===id)delete S.assign[k]}if(w==='t')S.students.forEach(s=>s.req=s.req.filter(r=>r.t!==id))})});
  root.querySelectorAll('[data-rq]').forEach(x=>x.onchange=()=>{const[i,j,f]=x.dataset.rq.split('|');commit(()=>{S.students[i].req[j][f]=f==='n'?Math.max(1,Math.min(6,+x.value||1)):x.value})});
  root.querySelectorAll('[data-sp]').forEach(x=>x.onchange=()=>{const[i,j]=x.dataset.sp.split('|');commit(()=>{const sp=S.students[i].span||=[2,4];sp[j]=Math.max(1,Math.min(6,+x.value||1));if(sp[0]>sp[1])sp[j?0:1]=sp[j]})});
  root.querySelectorAll('[data-fs]').forEach(b=>b.onclick=()=>{ui.fs=b.dataset.fs;render()});
  root.querySelectorAll('[data-fo]').forEach(b=>b.onclick=()=>{ui.fo=b.dataset.fo==='1';render()});
  root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ui.tab='person';ui.who=b.dataset.go;render()});
  root.querySelectorAll('[data-rqdel]').forEach(b=>b.onclick=()=>{const[i,j]=b.dataset.rqdel.split('|');commit(()=>S.students[i].req.splice(j,1))});
  root.querySelectorAll('[data-rqadd]').forEach(b=>b.onclick=()=>commit(()=>S.students[b.dataset.rqadd].req.push({t:S.teachers[0].id,n:1})));
  const nid=(arr,p)=>p+(Math.max(0,...arr.map(x=>+x.id.slice(1)||0))+1);
  if(g('expJ'))g('expJ').onclick=()=>{const bl=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='학원시간표_백업_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
  if(g('impJ'))g('impJ').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!o.teachers||!o.students||!o.assign)throw 0;commit(()=>{S=o;S.teachers.forEach(t=>t.av=t.av.slice(0,ND));S.students.forEach(s=>{s.av=s.av.slice(0,ND);if(!s.span)s.span=[2,4]})})}catch(x){g('bk').textContent='백업 파일 형식이 올바르지 않습니다.'}};
  if(g('resetS'))g('resetS').onclick=()=>{if(g('resetS').dataset.ok){commit(()=>{S=seed();S.assign=autoSchedule(S,'all',30).assign})}else{g('resetS').dataset.ok=1;g('resetS').textContent='한 번 더 누르면 초기화'}};
  if(g('instD'))g('instD').onclick=async()=>{try{await desktopApi.install.request()}catch(x){g('bk').textContent='설치를 시작하지 못했습니다.'}};
  if(g('addT'))g('addT').onclick=()=>commit(()=>S.teachers.push({id:nid(S.teachers,'T'),name:'새 선생님',subj:'과목',av:DAYS.map(()=>[0,12])}));
  if(g('addS'))g('addS').onclick=()=>commit(()=>S.students.push({id:nid(S.students,'S'),name:'새 학생',grade:'',av:DAYS.map(()=>[6,12]),req:[],span:[2,4]}));
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelector('.sheet')?.remove();if(drag)endDrag(true)}});
/* ---------- drag & drop ---------- */
let drag=null,ghost=null,pend=null,dragEndAt=0;
const cellAt=(x,y)=>{const el=document.elementFromPoint(x,y);return{btn:el&&el.closest('td button[data-cell]'),day:el&&el.closest('[data-day]')}};
function judge(tk){if(!tk||tk===drag.k)return null;const[d,p,t]=tk.split('|');const te=T(t),s=ST(drag.sid);
  if(!te||!inAv(te.av[d],+p))return['no','선생님 근무시간 외 — 놓을 수 없음'];
  const other=S.assign[tk];
  if(S.teachers.some(x=>{const kk=K(d,p,x.id);return kk!==tk&&kk!==drag.k&&S.assign[kk]===drag.sid}))return['warn','이 시간 다른 수업과 중복'];
  if(!inAv(s.av[d],+p))return['warn','학생 등원 시간 외'];
  if(!s.req.some(r=>r.t===t))return['warn','담당 선생님이 아님'];
  if(other){const o=ST(other);return['ok',(o?o.name:'')+' 학생과 자리 바꾸기']}
  return['ok',DAYS[d]+' '+fm(+p)+' · '+te.name+' 선생님으로 이동']}
function startDrag(k,x,y){const sid=S.assign[k];if(!sid||!canEdit)return;drag={k,sid,tk:null,res:null,dayT:null,dayH:null};
  ghost=document.createElement('div');ghost.className='ghost';ghost.innerHTML='<b></b><small></small>';ghost.querySelector('b').textContent=ST(sid)?.name||'';
  document.body.appendChild(ghost);document.body.classList.add('dragging');
  document.querySelector(`[data-cell="${k}"]`)?.closest('td').classList.add('dsrc');try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}moveDrag(x,y)}
function moveDrag(x,y){ghost.style.transform=`translate(${x+14}px,${y+14}px)`;const{btn,day}=cellAt(x,y);
  document.querySelectorAll('.dz-ok,.dz-warn,.dz-no').forEach(e=>e.classList.remove('dz-ok','dz-warn','dz-no'));
  drag.tk=btn?btn.dataset.cell:null;drag.res=judge(drag.tk);
  if(btn&&drag.res)btn.closest('td').classList.add('dz-'+drag.res[0]);
  ghost.className='ghost'+(drag.res?' g-'+drag.res[0]:'');ghost.querySelector('small').textContent=drag.res?drag.res[1]:(day?'잠시 머무르면 '+day.textContent+'요일로 전환':'놓을 칸으로 이동하세요');
  const dd=day?+day.dataset.day:null;if(dd!==drag.dayH){clearTimeout(drag.dayT);drag.dayH=dd;if(dd!==null&&dd!==ui.day)drag.dayT=setTimeout(()=>{ui.day=dd;render();document.querySelector(`[data-cell="${drag?.k}"]`)?.closest('td').classList.add('dsrc')},450)}
  const sc=document.querySelector('.board')?.closest('.scroll');if(sc){const r=sc.getBoundingClientRect();if(y>r.top&&y<r.bottom){if(x<r.left+48)sc.scrollLeft-=14;else if(x>r.right-48)sc.scrollLeft+=14}}
  if(y<60)window.scrollBy(0,-14);else if(y>innerHeight-60)window.scrollBy(0,14)}
function endDrag(cancel){if(!drag)return;const{k,sid,tk,res}=drag;clearTimeout(drag.dayT);drag=null;dragEndAt=Date.now();
  ghost?.remove();ghost=null;document.body.classList.remove('dragging');document.querySelectorAll('.dz-ok,.dz-warn,.dz-no,.dsrc').forEach(e=>e.classList.remove('dz-ok','dz-warn','dz-no','dsrc'));
  if(cancel||!tk||!res||res[0]==='no')return;
  const[d1,p1]=k.split('|'),[d2,p2,t2]=tk.split('|');const ot=S.assign[tk];
  commit(()=>{const other=S.assign[tk];S.assign[tk]=sid;if(other)S.assign[k]=other;else delete S.assign[k]},`${ST(sid)?.name||''} ${DAYS[d1]} ${fm(+p1)} → ${DAYS[d2]} ${fm(+p2)} (${T(t2)?.name||''})`+(ot?` · ${ST(ot)?.name||''}와 교환`:''))}
document.addEventListener('mousedown',e=>{if(e.button!==0||!canEdit)return;const b=e.target.closest('td button[data-cell]');if(!b||!S.assign[b.dataset.cell])return;pend={k:b.dataset.cell,x:e.clientX,y:e.clientY};e.preventDefault()});
document.addEventListener('mousemove',e=>{if(drag)return moveDrag(e.clientX,e.clientY);if(pend&&Math.hypot(e.clientX-pend.x,e.clientY-pend.y)>5){startDrag(pend.k,e.clientX,e.clientY);pend=null}});
document.addEventListener('mouseup',()=>{pend=null;if(drag)endDrag(false)});
let lp=null;
document.addEventListener('touchstart',e=>{if(!canEdit||e.touches.length>1)return;const b=e.target.closest('td button[data-cell]');if(!b||!S.assign[b.dataset.cell])return;const t=e.touches[0];
  lp={x:t.clientX,y:t.clientY,k:b.dataset.cell,timer:setTimeout(()=>{if(lp){startDrag(lp.k,lp.x,lp.y);lp=null}},320)}},{passive:true});
document.addEventListener('touchmove',e=>{const t=e.touches[0];if(drag){e.preventDefault();moveDrag(t.clientX,t.clientY);return}
  if(lp&&Math.hypot(t.clientX-lp.x,t.clientY-lp.y)>8){clearTimeout(lp.timer);lp=null}else if(lp){lp.x=t.clientX;lp.y=t.clientY}},{passive:false});
document.addEventListener('touchend',e=>{if(lp){clearTimeout(lp.timer);lp=null}if(drag){e.preventDefault();endDrag(false)}},{passive:false});
document.addEventListener('touchcancel',()=>{if(lp){clearTimeout(lp.timer);lp=null}if(drag)endDrag(true)});
window.addEventListener('hashchange',()=>{const x=location.hash.slice(1);if(/^(teacher|student)-/.test(x)){ui.tab='person';ui.who=x.split('-')[1];render()}});

render();
(async()=>{try{
  const [a,u]=await Promise.all([window.claude?.use?window.claude.use('artifact'):null,window.claude?.use?window.claude.use('user'):null]);
  artifact=a;
  if(!a){canEdit=true;mode='local';try{const v=localStorage.getItem(LSK);if(v){const o=JSON.parse(v);if(o&&o.teachers){S=o}}}catch(e){}}else{const own=u?((await u.isOwner())||(await u.canEdit())):false;canEdit=!!own;mode=canEdit?'saved':'readonly';userApi=u;try{myId=u?await u.id():null}catch(e){}}
}catch(e){canEdit=true;mode='local'}render();
  try{const dk=await window.claude?.use?.('desktop');if(dk&&dk.install&&await dk.install.state()==='available'){desktopApi=dk;render()}}catch(e){}})();
}
</script><script>if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(function(){})}</script></body></html>
